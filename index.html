<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="boxes">
          <div class="call">
            <span class="quantity">185</span> <span class="left">GB LEFT</span>
          </div>
          <div class="box">
            <div class="logo">
              <img src="ChatGPT Image Oct 1, 2026, 09_33_18 AM.png" alt="" />
            </div>
            <div class="images">
              <div class="icon-box">
                <img src="icon-document.svg" alt="" />
              </div>
              <div class="icon-box">
                <img src="icon-folder.svg" alt="" />
              </div>
              <div class="icon-box">
                <img src="icon-upload.svg" alt="" />
              </div>
            </div>
          </div>

          <div class="boc">
            <h3>You've used <span>815 GB</span> of your storage</h3>
            <div class="progress-bar">
              <div class="progress"></div>
            </div>
            <div class="flx">
              <h5>0GB</h5>
              <h5>1000GB</h5>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
